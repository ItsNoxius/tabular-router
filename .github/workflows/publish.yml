name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      # Do not set registry-url here — it makes setup-node set NODE_AUTH_TOKEN=""
      # which blocks npm OIDC trusted publishing (misleading 404 on publish).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup npm for trusted publishing
        run: |
          corepack enable
          corepack prepare npm@11.6.2 --activate
          node --version
          npm --version

      - name: Block legacy npm token secrets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ] || [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Remove NPM_TOKEN and NODE_AUTH_TOKEN repository secrets. Trusted publishing uses OIDC only."
            exit 1
          fi

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log publish version
        run: |
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            echo "Publishing ${{ steps.version.outputs.version }} (from tag)"
          else
            echo "Publishing $(node -p "require('./package.json').version") (from package.json)"
          fi

      - name: Publish to npm
        run: |
          # setup-node can leave NODE_AUTH_TOKEN="" which blocks OIDC; unset it entirely.
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          npm config delete //registry.npmjs.org/:_authToken --location=project 2>/dev/null || true
          npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true
          npm publish --access public --provenance

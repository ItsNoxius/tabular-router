name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing requires npm 11.5.1+ (OIDC). Use Corepack instead of
      # `npm install -g`, which can fail on runners with a broken bundled npm.
      - name: Setup npm for trusted publishing
        run: |
          corepack enable
          corepack prepare npm@11.6.2 --activate
          node --version
          npm --version

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log publish version
        run: |
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            echo "Publishing ${{ steps.version.outputs.version }} (from tag)"
          else
            echo "Publishing $(node -p "require('./package.json').version") (from package.json)"
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
